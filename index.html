    <script>
        // 1. Second highest score
        function secondhighest(arr)
        {
            let highest = -Infinity;
            let second = -Infinity;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > highest) {
                    second = highest;
                    highest = arr[i];
                } else if (arr[i] > second && arr[i] !== highest) {
                    second = arr[i];
                }
            }

            return second === -Infinity ? "No second highest" : second;
        }
        console.log(secondhighest([10, 20, 30, 40, 50])); // Output: 40 
        
        // 2. Remove Duplicate Product IDs
        function removeduplicate(arr)
        {
            let uniqueIds=[]
            for (let i = 0; i < arr.length; i++) {
                if (!uniqueIds.includes(arr[i])) {
                    uniqueIds.push(arr[i]);
                }
            }
            return uniqueIds;
        }
        console.log(removeduplicate([1, 2, 3, 2, 4, 1])); // Output: [1, 2, 3, 4]

        // 3.Count Character Frequency

        function charfreq(str)
        {
            let freq = {};
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                freq[char] = (freq[char] || 0) + 1;
            }
            return freq;
        }
        console.log(charfreq("hello")); // Output: { h: 1, e: 1, l: 2, o: 1 }
