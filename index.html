    <script>
        // 1. Second highest score
        function secondhighest(arr)
        {
            let highest = -Infinity;
            let second = -Infinity;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > highest) {
                    second = highest;
                    highest = arr[i];
                } else if (arr[i] > second && arr[i] !== highest) {
                    second = arr[i];
                }
            }

            return second === -Infinity ? "No second highest" : second;
        }
        console.log(secondhighest([10, 20, 30, 40, 50])); // Output: 40 
        
        // 2. Remove Duplicate Product IDs
        function removeduplicate(arr)
        {
            let uniqueIds=[]
            for (let i = 0; i < arr.length; i++) {
                if (!uniqueIds.includes(arr[i])) {
                    uniqueIds.push(arr[i]);
                }
            }
            return uniqueIds;
        }
        console.log(removeduplicate([1, 2, 3, 2, 4, 1])); // Output: [1, 2, 3, 4]

        // 3.Count Character Frequency

        function charfreq(str)
        {
            let freq = {};
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                freq[char] = (freq[char] || 0) + 1;
            }
            return freq;
        }
        console.log(charfreq("hello")); // Output: { h: 1, e: 1, l: 2, o: 1 }
        
        // 4. Reversing a String
        function reversesrting(str)
        {
          let newstr=""
          for(i=str.length-1;i>=0;i--)
          {
            newstr+=str[i]
          }
        
        return newstr 
        }
        console.log(reversesrting("hello"))

        // 5.Find the Missing Roll Number
        function findmissing(arr, n)
        {
            for (let i = 1; i <= n; i++) {
                if (arr[i]==n)
                {
                    return i;

                }
            }
        }
        console.log(findmissing([1, 2, 4, 5], 5)); // Output: 3

        // 6.Check Whether Text Is a Palindrome
        function isPalindrome(str) 
        {
            for (let i = 0; i < str.length / 2; i++) 
            {
                if (str[i] !== str[str.length - 1 - i]) 
                {
                    return false;
                }
            }

            return true;
        }

        console.log(isPalindrome("ELE")); // Output: true
        console.log(isPalindrome("hello")); // Output: false


        // 7.Find the Highest Product Price
        function highestprice(arr) 
        {
            let highest = -Infinity;
            for (let i = 0; i < arr.length; i++) 
            {
                if (arr[i] > highest) 
                {
                    highest = arr[i];
                }
            }
            return highest;
        }
        console.log(highestprice([100, 200, 300, 400])); // Output: 400

        // 8.Search for a Product ID
        function findmissingid(arr, n)
        {
            for (let i = 1; i <= n; i++) {
                if (arr[i]==n)
                {
                    return i;

                }
            }
        }
        console.log(findmissingid([1, 2, 4, 5], 5)); // Output: 3

        // 9.Move All Zeros to the End
        function movezeros(arr) 
        {
            let zeros = [];
            let nonZeros = [];
            for (let i = 0; i < arr.length; i++) 
            {
                if (arr[i] === 0) 
                {
                    zeros.push(0);
                } else {
                    nonZeros.push(arr[i]);
                }
            }
            return nonZeros.concat(zeros);
        }
        console.log(movezeros([1, 0, 2, 0, 3])); // Output: [1, 2, 3, 0, 0]

        // 10. Filter Products by Price
        function filterbyprice(object,maxprice)
        {
            let filteredproducts={}
            for (let i = 0; i < object.length; i++) 
            {
                if (object[i].price <= maxprice) 
                {
                    filteredproducts[object[i].id] = object[i];
                }
            }
            return filteredproducts;
        }
        console.log(filterbyprice([{id: 1, name: "monitor", price: 5000}, 
        {id: 2, name: "keyboard", price: 200}, 
        {id: 3, name: "mouse", price: 300}], 
        1000)); 
        // Output: {2: {id: 2, name: "keyboard", price: 200}, 3: {id: 3, name: "mouse", price: 300}}
    </script>
